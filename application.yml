eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true

swagger:
  servers:
    - name: DEV
      url: http://localhost:8081

    - name: QA
      url: https://qa-api.example.com/auth

    - name: UAT
      url: https://uat-api.example.com/auth

    - name: PROD
      url: https://api.example.com/auth
