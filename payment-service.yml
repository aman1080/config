springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

swagger:
  servers:
    - name: DEV
      url: http://localhost:9090/payment-service

    - name: QA
      url: https://qa-api.example.com/auth

    - name: UAT
      url: https://uat-api.example.com/auth

    - name: PROD
      url: https://api.example.com/auth

spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

common:
  logging:
    manager:
      enabled: true
      base-package: com.mycompany.paymentservice
